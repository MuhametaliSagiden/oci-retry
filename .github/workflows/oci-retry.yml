name: OCI ARM retry

# Запускается каждые 10 минут. Каждый запуск делает попытки в течение
# ~8 минут (MAX_RUNTIME_SECONDS=480), затем мягко выходит, если ёмкости нет.
# При успехе — Telegram-уведомление и инстанс уже у тебя в OCI.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Не запускать параллельно несколько раннеров — они начнут перетягивать капасити друг у друга.
concurrency:
  group: oci-arm-retry
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Set up OCI config
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_PRIVATE_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${OCI_USER_OCID}
          fingerprint=${OCI_FINGERPRINT}
          tenancy=${OCI_TENANCY_OCID}
          region=${OCI_REGION}
          key_file=/home/runner/.oci/oci_api_key.pem
          EOF

      - name: Try launch
        env:
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          OCI_OCPUS: "4"
          OCI_MEMORY_GB: "24"
          OCI_BOOT_VOLUME_GB: "100"
          OCI_DISPLAY_NAME: atm10-arm
          # Уложиться в timeout-minutes (9) с запасом
          MAX_RUNTIME_SECONDS: "480"
          MIN_DELAY: "30"
          MAX_DELAY: "90"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          python oci_arm_retry.py
          rc=$?
          # rc=0  -> SUCCESS (инстанс создан) — отключаем workflow, чтобы не тратить минуты впустую.
          # rc=1  -> таймаут / лимит попыток (нет ёмкости), просто завершаемся успешно — повторим через 10 мин.
          # rc=2  -> фатальная ошибка конфигурации (auth, OCID), упасть и подсветить.
          # rc=3  -> LimitExceeded, тоже фатально.
          case $rc in
            0)
              echo "Instance launched. Disabling further runs."
              # Отключим workflow, чтобы не запускался каждые 10 минут впустую.
              # Нужно дать токену permission: actions:write — см. permissions ниже.
              ;;
            1)
              echo "No capacity yet, will retry next cron tick."
              exit 0
              ;;
            *)
              exit $rc
              ;;
          esac

    permissions:
      actions: write
      contents: read
